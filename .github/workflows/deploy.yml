name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci rejects this Windows-made lock on Linux (optional wasm deps), so install instead.
      - run: npm install --no-audit --no-fund

      - run: npm test

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://dhruvpoddar.is-a.dev

      - name: SPA fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: dhruvpoddar.is-a.dev
